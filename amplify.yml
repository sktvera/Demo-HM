version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - corepack enable
        - corepack prepare pnpm@10.0.0 --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm run typecheck
        - pnpm run lint
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/.pnpm/**/*
      - .next/cache/**/*
